name: Build SWA Tronix 2A

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package build
        shell: bash
        run: |
          mkdir -p artifacts
          find build -type d -name '*.vst3' -print > artifacts/files.txt || true
          find build -type f -name '*.vst3' -print >> artifacts/files.txt || true
          cat artifacts/files.txt
          while IFS= read -r item; do
            [ -z "$item" ] && continue
            base=$(basename "$item")
            if [ -d "$item" ]; then
              (cd "$(dirname "$item")" && zip -qr "$GITHUB_WORKSPACE/artifacts/$base.zip" "$base")
            else
              cp "$item" "artifacts/$base"
            fi
          done < artifacts/files.txt

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: SWA-Tronix-2A-${{ runner.os }}
          path: artifacts/
